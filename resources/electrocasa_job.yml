resources:
  jobs:
    electrocasa_job:
      name: electrocasa_job
      
      schedule:
        quartz_cron_expression: "0 0 8 * * ?"
        timezone_id: "America/Lima"
        pause_status: UNPAUSED

      tasks:
        - task_key: ingesta_productos
          notebook_task:
            notebook_path: ../notebooks/03_ingesta_productos.ipynb
          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: ejecutar_pipeline
          depends_on:
            - task_key: ingesta_productos
          pipeline_task:
            pipeline_id: ${resources.pipelines.electrocasa_pipeline.id}
            full_refresh: false
          max_retries: 2
          min_retry_interval_millis: 60000
